services:
  db:
    image: postgres:16-alpine
    container_name: taxi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taxi_predictions}
      POSTGRES_USER: ${POSTGRES_USER:-taxi_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en database/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # solo accesible desde tu PC
    volumes:
      - taxi_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  taxi_pgdata: